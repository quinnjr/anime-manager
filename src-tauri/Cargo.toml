[package]
name = "anime-manager"
version = "1.0.0"
description = "Scan an anime collection, play episodes in mpv and track what you have watched"
authors = ["Joseph R. Quinn <quinn.josephr@gmail.com>"]
license = "MIT"
repository = ""
edition = "2024"
# Edition 2024 resolves MSRV-aware: a dependency needing a newer Rust than
# this is held back by `cargo update`, so raise it to pick those up.
rust-version = "1.97"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "anime_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
walkdir = "2"
regex = "1"
once_cell = "1"
sha1 = "0.11"
serde-xml-fast = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "query"] }
tokio = { version = "1", features = ["process", "net", "io-util", "time", "sync", "macros"] }
thiserror = "2"
dirs = "7"
mdns-sd = "0.21"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-opener = "2.7.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# MPC-HC's /slave control is window messages (mpc_hc.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
