name: Release

# Builds the Linux and Windows bundles and attaches them to the GitHub release for a tag.
# Runs on tag push (the normal path, driven by `git flow release finish`) and can be
# re-run by hand against an existing tag if a build needs repeating.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach artifacts to (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  bundles:
    # Pinned to the oldest runner Tauri 2 supports: the glibc it links against sets the
    # floor for every distro the .deb, .rpm and AppImage will run on.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf \
            file wget curl

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Test
        # Single-threaded: the player tests drive a fake mpv through process-global env vars.
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
          pnpm test
          pnpm check

      - name: Build bundles
        env:
          # Runners have no usable FUSE, so linuxdeploy and appimagetool must unpack
          # themselves instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Stripping is left on here: 22.04's libraries predate the DT_RELR relocations that
          # break linuxdeploy's bundled `strip` on Arch and recent Fedora, and it saves ~30 MB.
          # If a future runner image starts failing on `.relr.dyn`, set NO_STRIP: 1.
        run: pnpm tauri build --bundles deb,rpm,appimage

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find src-tauri/target/release/bundle \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} dist/ \;
          ls -l dist
          # Fail loudly rather than publishing a release with a format silently missing.
          for ext in deb rpm AppImage; do
            compgen -G "dist/*.$ext" > /dev/null || { echo "::error::no .$ext produced"; exit 1; }
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: dist/*

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # `git flow release finish` pushes a tag but creates no release object, so make one
          # if it is missing rather than failing the upload.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    # After the Linux job, so only one job ever creates the release object.
    needs: bundles
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          # The player tests launch the fake mpv/VLC fixtures through their .cmd wrappers.
          python-version: '3.x'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # cargo runs under pwsh, not bash: Git Bash puts its own /usr/bin/link ahead of the
      # MSVC linker. One command per step, since pwsh only checks the last exit code.
      - name: Test (Rust)
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Test (frontend)
        shell: pwsh
        run: pnpm test

      - name: Check (frontend)
        shell: pwsh
        run: pnpm check

      - name: Build bundles
        shell: pwsh
        # Quoted, or pwsh splits nsis,msi into an array.
        run: pnpm tauri build --bundles 'nsis,msi'

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*.exe dist/ || { echo "::error::no NSIS installer produced"; exit 1; }
          cp src-tauri/target/release/bundle/msi/*.msi dist/ || { echo "::error::no .msi produced"; exit 1; }
          ls -l dist
          # Its own sums file, so it does not clobber the Linux job's SHA256SUMS.txt.
          (cd dist && sha256sum * > SHA256SUMS-windows.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: dist/*

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
